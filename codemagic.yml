workflows:
  default:
    name: Android AAB
    max_build_duration: 60
    environment:
      flutter: stable
    scripts:
      - name: Create android folder
        script: |
          if [ ! -d "android" ]; then
            flutter create . --platforms=android
          fi
      - name: Get deps
        script: flutter pub get
      - name: Build AAB
        script: flutter build appbundle --release
    artifacts:
      - build/app/outputs/**/*.aab
